<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | CookieGram</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5e9;
            color: #493024;
        }

        header {
            background: #8b4513;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
        }

        p {
            color: #847165;
        }

        .order-summary {
            background: #f8f5f0;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }

        .total {
            border-top: 1px solid #ded2c5;
            padding-top: 12px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #c9b6a8;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .cancel {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #8b4513;
            color: white;
        }

        .cancel {
            background: #eee4da;
            color: #493024;
        }

        .note {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍪 CookieGram — Checkout</h1>
    </header>

    <div class="container">

        <h2>Online Payment</h2>

        <p>Review your order before paying online.</p>

        <!-- Example only: replace with real order details later -->
        <div class="order-summary">

            <strong>Order Summary</strong>

            <div class="order-row">
                <span>Cookies × 1</span>
                <span>$25.00</span>
            </div>

            <div class="order-row total">
                <span>Total</span>
                <span>$25.00</span>
            </div>

        </div>

        <form>

            <label for="customerName">Full Name</label>
            <input
                type="text"
                id="customerName"
                name="customerName"
                placeholder="Enter your name"
                required
            >

            <label for="customerEmail">Email Address</label>
            <input
                type="email"
                id="customerEmail"
                name="customerEmail"
                placeholder="Enter your email"
                required
            >

            <div class="buttons">
                <button type="button">Continue to Payment</button>

                <a th:href="@{/customer}" class="cancel">Cancel</a>
            </div>

        </form>

        <p class="note">
            Online payment will be available once a secure payment provider
            is connected.
        </p>

    </div>

</body>
</html>
