<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookieGram | Customer</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #fff5e9; color: #493024; }
        header { background: #8b4513; color: white; padding: 24px 7%; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        header h1 { margin: 0; }
        .header-links { display: flex; align-items: center; gap: 16px; }
        .header-link { color: white; font-weight: bold; text-decoration: none; }
        .header-link:hover { text-decoration: underline; }
        header button { background: white; color: #8b4513; padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        main { max-width: 900px; margin: 40px auto; padding: 0 24px; }
        h2 { color: #8b4513; }
        .shop-buttons { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0 30px; }
        .primary-button, .secondary-button { display: inline-block; padding: 12px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; }
        .primary-button { background: #8b4513; color: white; }
        .primary-button:hover { background: #69330d; }
        .secondary-button { border: 2px solid #8b4513; color: #8b4513; }
        .secondary-button:hover { background: #f5e5d5; }
        .promotions { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 18px rgba(73, 48, 36, 0.10); }
        .card img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .card h3 { margin: 0; padding: 16px; color: #8b4513; font-size: 18px; }
        footer { text-align: center; padding: 24px; color: #746258; }
    </style>
</head>
<body>
    <header>
        <h1>CookieGram</h1>
        <div class="header-links">
            <a th:href="@{/cart}" class="header-link">🛒 Cart</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Log Out</button>
            </form>
        </div>
    </header>

    <main>
        <h2>Welcome, Customer!</h2>

        <!-- Start shopping or continue to the cart -->
        <div class="shop-buttons">
            <a th:href="@{/products}" class="primary-button">Shop Cookies</a>
            <a th:href="@{/cart}" class="secondary-button">View Cart &amp; Checkout</a>
        </div>

        <section>
            <h2>Current Promotions</h2>
            <!-- One card is created for each promotion sent by the server -->
            <div class="promotions">
                <div class="card" th:each="promo : ${promotions}">
                    <img th:src="@{'/images/' + ${promo.image}}" th:alt="${promo.title}">
                    <h3 th:text="${promo.title}">Promotion</h3>
                </div>
            </div>
        </section>
    </main>

    <footer>&copy; 2026 CookieGram</footer>
</body>
</html>
