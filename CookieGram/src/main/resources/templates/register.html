<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookieGram | Create Account</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #fff5e9;
            color: #493024;
        }

        .register-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(73, 48, 36, 0.12);
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #8b4513;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #746258;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #c9b6a8;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #8b4513;
            outline-offset: 2px;
        }

        .hint {
            margin: -14px 0 20px;
            color: #746258;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #8b4513;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #69330d;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
        }

        .error {
            background: #fde8e8;
            color: #9b1c1c;
        }

        .links {
            margin-top: 24px;
            text-align: center;
            color: #746258;
        }

        .links a {
            color: #8b4513;
        }
    </style>
</head>
<body>
    <main class="register-card">
        <h1>CookieGram</h1>
        <p class="subtitle">Create your customer account.</p>

        <div th:if="${error}" class="message error" role="alert"
             th:text="${error}"></div>

        <!-- th:action adds the CSRF token automatically -->
        <form th:action="@{/register}" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" maxlength="100"
                   th:value="${name}" autocomplete="name" required autofocus>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" maxlength="150"
                   th:value="${email}" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   minlength="8" maxlength="72" autocomplete="new-password" required>
            <p class="hint">At least 8 characters.</p>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   minlength="8" maxlength="72" autocomplete="new-password" required>

            <button type="submit">Create Account</button>
        </form>

        <p class="links">
            Already have an account? <a th:href="@{/login}">Log in</a><br>
            <a th:href="@{/}">Back to home</a>
        </p>
    </main>
</body>
</html>
