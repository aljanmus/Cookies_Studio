<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Employee | CookieGram</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f8f5f0;

            color: #493024;
        }

        header {
            background: #493024;

            color: white;

            padding: 20px 30px;
        }

        header h1 {
            margin: 0;

            font-size: 24px;
        }

        .container {
            max-width: 500px;

            margin: 40px auto;

            padding: 30px;

            background: white;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
        }

        p {
            color: #847165;
        }

        label {
            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #c9b6a8;

            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #8b4513;

            outline-offset: 2px;
        }

        .buttons {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }

        button,
        .cancel {
            padding: 12px 18px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            text-decoration: none;
        }

        button {
            background: #8b4513;

            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #69330d;
        }

        .cancel {
            background: #eee4da;

            color: #493024;
        }

        .error {
            color: #b3261e;

            font-weight: bold;
        }

        @media (max-width: 550px) {

            .container {
                margin: 20px;
            }
        }

    </style>

</head>

<body>

    <header>

        <h1>🍪 CookieGram — Admin</h1>

    </header>

    <main class="container">

        <h2>Add Staff Member</h2>

        <p>Create a separate account for your staff member.</p>

        <!-- Error message -->
        <p
            class="error"
            role="alert"
            th:if="${error}"
            th:text="${error}">
        </p>

        <!-- Thymeleaf includes the Spring Security CSRF token -->
        <form
            th:action="@{/admin/add-employee}"
            method="post">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter staff member's name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email address"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <div class="buttons">

                <button type="submit">
                    Create Account
                </button>

                <a
                    th:href="@{/admin}"
                    class="cancel">
                    Cancel
                </a>

            </div>

        </form>

    </main>

</body>

</html>
