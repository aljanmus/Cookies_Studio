<section class="card">

    <h2>Employees</h2>

    <div
        th:if="${employees == null or #lists.isEmpty(employees)}"
        class="empty">

        No employees yet.

    </div>

    <th:block th:if="${employees != null}">

        <div
            class="employee"
            th:each="employee : ${employees}">

            <div class="avatar" aria-hidden="true">
                👤
            </div>

            <div>

                <strong th:text="${employee.name}">
                    Employee name
                </strong>

                <p th:text="${employee.role}">
                    Employee role
                </p>

            </div>

        </div>

    </th:block>

</section>
