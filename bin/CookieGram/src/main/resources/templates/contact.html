<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Us | CookieGram</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5e9;
            color: #493024;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 20px 7%;
            background: #8b4513;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        .home-link {
            padding: 10px 18px;
            border-radius: 8px;
            background: white;
            color: #8b4513;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(73, 48, 36, 0.12);
        }

        h2 {
            margin-top: 0;
            color: #8b4513;
            font-size: 30px;
        }

        .description {
            color: #746258;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #c9b6a8;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #8b4513;
            outline-offset: 2px;
        }

        button {
            margin-top: 22px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #8b4513;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #69330d;
        }

        .success {
            padding: 14px;
            border-radius: 8px;
            background: #e8f5e9;
            color: #256029;
        }

        .error {
            padding: 14px;
            border-radius: 8px;
            background: #ffebee;
            color: #a32626;
        }

        .optional {
            color: #847165;
            font-size: 13px;
            font-weight: normal;
        }

        footer {
            padding: 25px;
            text-align: center;
            color: #746258;
        }

        @media (max-width: 700px) {

            .container {
                margin: 25px 18px;
                padding: 25px;
            }

            header h1 {
                font-size: 22px;
            }
        }

    </style>

</head>

<body>

    <header>

        <h1>🍪 CookieGram</h1>

        <a th:href="@{/}" class="home-link">
            Home
        </a>

    </header>

    <main class="container">

        <h2>Contact Us</h2>

        <p class="description">
            Have a question? Write your message below and send it to us.
            You can add your email or phone number if you would like us
            to contact you.
        </p>

        <!-- Success message -->
        <p
            class="success"
            th:if="${success}"
            th:text="${success}"
            role="status">
        </p>

        <!-- Error message -->
        <p
            class="error"
            th:if="${error}"
            th:text="${error}"
            role="alert">
        </p>

        <form th:action="@{/contact}" method="post">

            <label for="name">
                Your Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                maxlength="100"
                required
            >

            <label for="email">
                Email Address
                <span class="optional">(optional)</span>
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                maxlength="150"
            >

            <label for="phone">
                Phone Number
                <span class="optional">(optional)</span>
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                maxlength="30"
            >

            <label for="message">
                Your Message
            </label>

            <textarea
                id="message"
                name="message"
                placeholder="Write your message here..."
                maxlength="2000"
                required></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </main>

    <footer>
        &copy; 2026 CookieGram. All rights reserved.
    </footer>

</body>

</html>
