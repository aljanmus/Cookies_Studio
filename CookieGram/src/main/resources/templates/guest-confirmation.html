<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CookieGram | Order Confirmed</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #fff5e9; color: #493025; }
        header { background: #8b4513; color: white; padding: 24px 7%; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; }
        header a { background: white; color: #8b4513; padding: 10px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; }
        main { max-width: 600px; margin: 40px auto; padding: 0 24px; text-align: center; }
        h2 { color: #8b4513; }
        .box { background: white; padding: 32px 24px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08); }
        footer { text-align: center; padding: 24px; color: #746258; }
    </style>
</head>
<body>
    <header>
        <h1>CookieGram</h1>
        <a th:href="@{/}">Home</a>
    </header>

    <main>
        <div class="box">
            <!-- Shows the guest's name; falls back to a general message if the page is refreshed -->
            <h2 th:if="${name}" th:text="'Thank you, ' + ${name} + '!'">Thank you!</h2>
            <h2 th:unless="${name}">Thank you!</h2>

            <p>Your order has been placed. We'll send the details to your email.</p>

            <p><a th:href="@{/}">Back to Home</a></p>
        </div>
    </main>

    <footer>
        &copy; CookieGram
    </footer>
</body>
</html>
