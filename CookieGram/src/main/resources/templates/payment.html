<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | CookieGram</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5e9;
            color: #493024;
        }

        header {
            background: #8b4513;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
        }

        p {
            color: #847165;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .error {
            background: #fde8e8;
            color: #9b1c1c;
        }

        .order-summary {
            background: #f8f5f0;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }

        .total {
            border-top: 1px solid #ded2c5;
            padding-top: 12px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #c9b6a8;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .cancel {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #8b4513;
            color: white;
        }

        .cancel {
            background: #eee4da;
            color: #493024;
        }

        .note {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍪 CookieGram — Checkout</h1>
    </header>

    <div class="container">

        <h2>Checkout</h2>

        <p>Review your order before placing it.</p>

        <div th:if="${error}" class="message error" role="alert"
             th:text="${error}"></div>

        <!-- Order summary from the cart -->
        <div class="order-summary">

            <strong>Order Summary</strong>

            <div class="order-row" th:each="item : ${cartItems}">
                <span th:text="${item.product.name} + ' × ' + ${item.quantity}">Cookies × 1</span>
                <span th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">$0.00</span>
            </div>

            <div class="order-row total">
                <span>Total</span>
                <span th:text="'$' + ${#numbers.formatDecimal(cartTotal, 1, 2)}">$0.00</span>
            </div>

        </div>

        <!-- th:action adds the CSRF token automatically -->
        <form th:action="@{/customer/payment}" method="post">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                maxlength="150"
                th:value="${email}"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="address">Delivery Address</label>
            <textarea
                id="address"
                name="address"
                rows="3"
                maxlength="300"
                autocomplete="street-address"
                required
            ></textarea>

            <div class="buttons">
                <button type="submit">Place Order</button>

                <a th:href="@{/cart}" class="cancel">Back to Cart</a>
            </div>

        </form>

        <p class="note">
            Online payment will be available once a secure payment provider
            is connected.
        </p>

    </div>

</body>
</html>
